name: OpenCodeReview

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      provider:
        description: LLM provider to use
        required: true
        default: primary
        type: choice
        options:
          - primary
          - fallback
          - retry
      effort:
        description: Review effort; auto selects low or medium from PR size
        required: true
        default: auto
        type: choice
        options:
          - auto
          - low
          - medium
          - high

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: >-
    ${{
      github.event_name == 'workflow_dispatch'
      && format('ocr-{0}', inputs.pr_number)
      || (
        github.event.issue.pull_request
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '/ocr')
        )
        && format('ocr-{0}', github.event.issue.number)
        || format('ocr-noop-{0}', github.run_id)
      )
    }}
  cancel-in-progress: true

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Single source for the CLI version: our pre-install and the action input.
      OCR_VERSION: "1.12.4"
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '/ocr')
          )
        )
      }}
    steps:
      - name: Resolve provider and validate command
        id: provider
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_PROVIDER: ${{ inputs.provider || '' }}
          REQUESTED_EFFORT: ${{ inputs.effort || '' }}
          PRIMARY_CONFIGURED: ${{ vars.OCR_PRIMARY_URL != '' && vars.OCR_PRIMARY_MODEL != '' && secrets.OCR_PRIMARY_API_KEY != '' }}
          FALLBACK_CONFIGURED: ${{ vars.OCR_FALLBACK_URL != '' && vars.OCR_FALLBACK_MODEL != '' && secrets.OCR_FALLBACK_API_KEY != '' }}
        with:
          script: |
            const requestedProvider = process.env.REQUESTED_PROVIDER;
            let provider = requestedProvider || 'primary';

            if (context.eventName === 'issue_comment') {
              const command = context.payload.comment.body.trim();
              const match = command.match(/^(?:\/open-code-review|\/ocr)(?:\s+(primary|fallback|retry|high))?$/i);

              if (!match) {
                core.setFailed('Use exactly /ocr, /ocr primary, /ocr retry, /ocr fallback, or /ocr high.');
                return;
              }

              const commandProvider = match[1]?.toLowerCase();
              provider = commandProvider === 'fallback' ? 'fallback' : commandProvider === 'retry' ? 'retry' : 'primary';
              core.setOutput('effort_override', commandProvider === 'high' ? 'high' : '');
            } else if (['auto', 'low', 'medium', 'high'].includes(process.env.REQUESTED_EFFORT)) {
              core.setOutput('effort_override', process.env.REQUESTED_EFFORT === 'auto' ? '' : process.env.REQUESTED_EFFORT);
            } else if (process.env.REQUESTED_EFFORT) {
              core.setFailed(`Unsupported effort: ${process.env.REQUESTED_EFFORT}`);
              return;
            }

            if (!['primary', 'fallback'].includes(provider)) {
              if (provider !== 'retry') {
                core.setFailed(`Unsupported provider: ${provider}`);
                return;
              }
            }

            const configured = provider === 'fallback'
              ? process.env.FALLBACK_CONFIGURED === 'true'
              : process.env.PRIMARY_CONFIGURED === 'true';
            if (!configured) {
              core.setFailed(`${provider} OpenCodeReview provider is not fully configured.`);
              return;
            }

            core.setOutput('provider', provider);

      # Runs after validation so an unparseable command or an unconfigured
      # provider never leaves a "working on it" reaction behind.
      - name: Acknowledge review request
        if: ${{ github.event_name == 'issue_comment' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            try {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'eyes',
              });
            } catch (error) {
              core.warning(`Could not acknowledge the review request: ${error.message}`);
            }

      - name: Resolve pull request refs
        id: pr-context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
        with:
          script: |
            const pullNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(pullNumber) || pullNumber < 1) {
              core.setFailed(`Invalid pull request number: ${process.env.PR_NUMBER}`);
              return;
            }

            let pullRequest;
            try {
              ({ data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              }));
            } catch (error) {
              core.setFailed(`Unable to load pull request #${pullNumber}: ${error.message}`);
              return;
            }

            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Select review effort
        id: effort
        if: ${{ !steps.provider.outputs.effort_override }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const pullNumber = Number(process.env.PR_NUMBER);
            let effort = 'medium';
            try {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                per_page: 100,
              });
              const changedLines = files.reduce((total, file) => total + file.additions + file.deletions, 0);
              effort = files.length <= 5 && changedLines <= 120 ? 'low' : 'medium';
              core.info(`Selected ${effort} effort for ${files.length} files and ${changedLines} changed lines.`);
            } catch (error) {
              core.warning(`Could not measure the pull request size (${error.message}); using ${effort} effort.`);
            }
            core.setOutput('effort', effort);

      - name: Check LLM provider
        env:
          LLM_URL: ${{ steps.provider.outputs.provider == 'fallback' && vars.OCR_FALLBACK_URL || vars.OCR_PRIMARY_URL }}
          LLM_MODEL: ${{ steps.provider.outputs.provider == 'fallback' && vars.OCR_FALLBACK_MODEL || vars.OCR_PRIMARY_MODEL }}
          LLM_TOKEN: ${{ steps.provider.outputs.provider == 'fallback' && secrets.OCR_FALLBACK_API_KEY || secrets.OCR_PRIMARY_API_KEY }}
          LLM_SESSION: ${{ github.repository }}-pr-${{ github.event.issue.number || inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          response_code=000
          curl_exit=0
          curl --silent --show-error \
            --output /tmp/ocr-llm-preflight-response.json \
            --write-out '%{http_code}' \
            --max-time 30 \
            -X POST "$LLM_URL" \
            -H "Authorization: Bearer $LLM_TOKEN" \
            -H "x-opencode-session: $LLM_SESSION" \
            -H 'User-Agent: YARK-OpenCodeReview/1.0' \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn \
              --arg model "$LLM_MODEL" \
              '{model: $model, messages: [{role: "user", content: "Reply with OK"}], max_tokens: 4}')" \
            > /tmp/ocr-llm-preflight-status.txt || curl_exit=$?

          if [[ "$curl_exit" -ne 0 ]]; then
            echo "::error::LLM provider preflight could not connect (curl exit $curl_exit)"
            cat /tmp/ocr-llm-preflight-response.json 2>/dev/null || true
            exit 1
          fi

          response_code="$(cat /tmp/ocr-llm-preflight-status.txt)"
          if [[ ! "$response_code" =~ ^2 ]]; then
            echo "::error::LLM provider preflight failed with HTTP $response_code"
            jq 'del(.choices, .usage)' /tmp/ocr-llm-preflight-response.json 2>/dev/null \
              || cat /tmp/ocr-llm-preflight-response.json
            exit 1
          fi

          echo "LLM provider preflight succeeded for model $LLM_MODEL"

      - name: Prepare OpenCodeReview CLI
        shell: bash
        run: |
          set -euo pipefail

          ocr_npm_prefix="${RUNNER_TEMP}/ocr-npm-global"
          npm config set prefix "$ocr_npm_prefix"
          echo "NPM_CONFIG_PREFIX=$ocr_npm_prefix" >> "$GITHUB_ENV"

          # Install here instead of leaving it to the action. The package's
          # postinstall fetches the platform binary with a nested npm run that
          # outlives its parent, and npm relinks `bin/ocr` as `.ocr-<random>` while
          # it does - the action's next step execs that bin path inside the window
          # where the final name is not in place yet, which fails the job with
          # "No such file or directory".
          npm install -g "@alibaba-group/open-code-review@${OCR_VERSION}"

          ocr_entry="${ocr_npm_prefix}/lib/node_modules/@alibaba-group/open-code-review/bin/ocr.js"
          ocr_ready=false
          for _ in $(seq 1 60); do
            if [ -x "$ocr_entry" ] && "$ocr_entry" version >/dev/null 2>&1; then
              ocr_ready=true
              break
            fi
            sleep 1
          done
          if [ "$ocr_ready" != "true" ]; then
            echo "::error::OpenCodeReview CLI did not become runnable at ${ocr_entry}"
            ls -la "${ocr_npm_prefix}/bin" 2>&1 || true
            ls -la "${ocr_npm_prefix}/lib/node_modules/@alibaba-group" 2>&1 || true
            exit 1
          fi

          # Expose the CLI through a wrapper in a directory npm never rewrites, so
          # a later relink of `<prefix>/bin` cannot hide it from the action.
          ocr_shim_dir="${RUNNER_TEMP}/ocr-cli"
          mkdir -p "$ocr_shim_dir"
          {
            echo '#!/usr/bin/env bash'
            printf 'exec node %q "$@"\n' "$ocr_entry"
          } > "${ocr_shim_dir}/ocr"
          chmod +x "${ocr_shim_dir}/ocr"
          echo "$ocr_shim_dir" >> "$GITHUB_PATH"

          "${ocr_shim_dir}/ocr" version

      - name: Run OpenCodeReview
        id: ocr-review
        uses: alibaba/open-code-review@7a571b78d3493b249f6ad14d835c6a79a0a67d2e # v1.12.6
        with:
          llm_url: ${{ steps.provider.outputs.provider == 'fallback' && vars.OCR_FALLBACK_URL || vars.OCR_PRIMARY_URL }}
          llm_auth_token: ${{ steps.provider.outputs.provider == 'fallback' && secrets.OCR_FALLBACK_API_KEY || secrets.OCR_PRIMARY_API_KEY }}
          llm_model: ${{ steps.provider.outputs.provider == 'fallback' && vars.OCR_FALLBACK_MODEL || vars.OCR_PRIMARY_MODEL }}
          llm_use_anthropic: false
          # Session id stays stable for the life of the PR: this value is part of
          # the checkpoint fingerprint, so a per-head value would fail closed to a
          # full review on every push and make checkpoint_range a no-op.
          llm_extra_headers: x-opencode-session=${{ github.repository }}-pr-${{ github.event.issue.number || inputs.pr_number }}
          llm_extra_body: "{}"
          language: English
          ocr_version: ${{ env.OCR_VERSION }}
          effort: ${{ steps.provider.outputs.effort_override || steps.effort.outputs.effort }}
          sticky_summary: true
          incremental: true
          checkpoint_range: true
          full_review: ${{ steps.provider.outputs.provider == 'retry' }}
          github_token: ${{ github.token }}
          pr_number: ${{ github.event.issue.number || inputs.pr_number }}
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}

      - name: Enrich OpenCodeReview summary
        if: ${{ steps.ocr-review.outcome == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
          OCR_SUMMARY_URL: ${{ steps.ocr-review.outputs.summary_comment_url }}
          OCR_COMMENTS_TOTAL: ${{ steps.ocr-review.outputs.comments_total }}
          OCR_COMMENTS_INLINE: ${{ steps.ocr-review.outputs.comments_inline }}
          OCR_COMMENTS_ROUTED: ${{ steps.ocr-review.outputs.comments_routed }}
          OCR_RANGE_SUMMARY: ${{ steps.ocr-review.outputs.range_summary }}
          OCR_PROVIDER: ${{ steps.provider.outputs.provider }}
          OCR_MODEL: ${{ steps.provider.outputs.provider == 'fallback' && vars.OCR_FALLBACK_MODEL || vars.OCR_PRIMARY_MODEL }}
          OCR_EFFORT: ${{ steps.provider.outputs.effort_override || steps.effort.outputs.effort }}
          OCR_LLM_URL: ${{ steps.provider.outputs.provider == 'fallback' && vars.OCR_FALLBACK_URL || vars.OCR_PRIMARY_URL }}
          OCR_LLM_TOKEN: ${{ steps.provider.outputs.provider == 'fallback' && secrets.OCR_FALLBACK_API_KEY || secrets.OCR_PRIMARY_API_KEY }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- yark-ocr-enriched-summary -->';
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber < 1) {
              core.warning(`Invalid pull request number: ${process.env.PR_NUMBER}`);
              return;
            }

            const summaryUrl = process.env.OCR_SUMMARY_URL || '';
            const commentIdMatch = summaryUrl.match(/issuecomment-(\d+)/);

            // A transient API error must not red-X a run whose review already
            // posted its findings.
            try {
              let commentId = commentIdMatch ? Number(commentIdMatch[1]) : 0;
              if (!commentId) {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  per_page: 100,
                });
                const existing = comments.reverse().find((comment) =>
                  comment.user?.login === 'github-actions[bot]' &&
                  /OpenCodeReview/i.test(comment.body || '') &&
                  /Review complete/i.test(comment.body || '')
                );
                commentId = existing?.id || 0;
              }

              if (!commentId) {
                core.warning('Could not locate the OpenCodeReview summary comment to enrich.');
                return;
              }

              const current = await github.rest.issues.getComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
              });
              const withoutPreviousDetails = (current.data.body || '')
                .replace(new RegExp(`\\n*${marker}[\\s\\S]*$`), '')
                .trimEnd();
              const total = Number(process.env.OCR_COMMENTS_TOTAL || 0);
              const inline = Number(process.env.OCR_COMMENTS_INLINE || 0);
              const routed = Number(process.env.OCR_COMMENTS_ROUTED || 0);
              const result = total === 0 ? '✅ No findings requiring action.' : '⚠️ Findings were posted as inline review comments.';
              let prSummary = 'Summary generation was unavailable for this run.';
              try {
                const diffResponse = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  mediaType: { format: 'diff' },
                });
                const diff = String(diffResponse.data || '').slice(0, 50000);
                const llmResponse = await fetch(process.env.OCR_LLM_URL, {
                  method: 'POST',
                  headers: {
                    authorization: `Bearer ${process.env.OCR_LLM_TOKEN}`,
                    'content-type': 'application/json',
                  },
                  body: JSON.stringify({
                    model: process.env.OCR_MODEL,
                    temperature: 0.2,
                    max_tokens: 700,
                    messages: [{
                      role: 'user',
                      content: [
                        'Write a concise GitHub pull request summary in English based only on the diff below.',
                        'Explain what the PR changes from an operator or user perspective, grouping related changes into 2-5 bullets.',
                        'Do not mention code review findings, models, prompts, or the diff. Do not invent behavior.',
                        'Return only Markdown bullets, without a heading.',
                        '',
                        diff,
                      ].join('\\n'),
                    }],
                  }),
                });
                if (!llmResponse.ok) {
                  throw new Error(`summary model returned HTTP ${llmResponse.status}`);
                }
                const payload = await llmResponse.json();
                const content = payload.choices?.[0]?.message?.content?.trim();
                if (content) {
                  prSummary = content;
                }
              } catch (error) {
                core.warning(`Could not generate the PR summary: ${error.message}`);
              }
              const details = [
                marker,
                '### PR summary',
                prSummary,
                '### Review details',
                `- **Result:** ${result}`,
                `- **Findings:** ${total} (${inline} inline, ${routed} in summary)`,
                `- **Review range:** ${process.env.OCR_RANGE_SUMMARY || 'full PR range'}`,
                `- **Provider:** ${process.env.OCR_PROVIDER || 'primary'} (${process.env.OCR_MODEL || 'configured model'})`,
                `- **Effort:** ${process.env.OCR_EFFORT || 'medium'}`,
              ].join('\n');

              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: `${withoutPreviousDetails}\n\n${details}`,
              });
            } catch (error) {
              core.warning(`Could not enrich the OpenCodeReview summary: ${error.message}`);
            }
