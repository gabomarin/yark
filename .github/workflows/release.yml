name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to rebuild and (re)publish (e.g. v0.1.0)"
        required: true
        type: string

# Least privilege by default; the release job elevates contents for publishing only.
permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Tag pushes and manual rebuilds only run in this repo (not fork PRs).
    if: github.repository == 'gabomarin/yark'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "::error::Tag must look like vX.Y.Z (got: $TAG)"
              exit 1
              ;;
          esac
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # true when SemVer has a prerelease label (e.g. 0.1.0-alpha) or is still 0.x
          VER="${TAG#v}"
          if [[ "$VER" == *-* ]] || [[ "$VER" == 0.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches tag
        shell: bash
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG_VER="${{ steps.tag.outputs.version }}"
          # Exact match: v0.1.0-alpha ↔ 0.1.0-alpha
          # Or channel label on the same base: v0.1.0-alpha ↔ package 0.1.0
          if [ "$PKG" = "$TAG_VER" ] || [[ "$TAG_VER" == "$PKG"-* ]]; then
            echo "OK: package.json $PKG matches tag v$TAG_VER"
            exit 0
          fi
          echo "::error::package.json version ($PKG) does not match tag ${{ steps.tag.outputs.name }} (expected $PKG or $PKG-<label>)"
          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Require official CurseForge proxy URL
        shell: bash
        env:
          YARK_CURSEFORGE_PROXY_URL: ${{ vars.YARK_CURSEFORGE_PROXY_URL }}
        run: |
          set -euo pipefail
          if [ -z "${YARK_CURSEFORGE_PROXY_URL}" ]; then
            echo "::error::Repository variable YARK_CURSEFORGE_PROXY_URL is empty. Official releases must bake a CurseForge proxy base URL (see docs/curseforge-proxy.md)."
            exit 1
          fi
          # Same rules as normalizeCurseforgeProxyUrl (https, no credentials/query/hash).
          node <<'NODE'
          const raw = (process.env.YARK_CURSEFORGE_PROXY_URL ?? "").trim();
          let parsed;
          try {
            parsed = new URL(raw);
          } catch {
            console.error("::error::YARK_CURSEFORGE_PROXY_URL is not a valid URL");
            process.exit(1);
          }
          if (parsed.protocol !== "https:") {
            console.error("::error::YARK_CURSEFORGE_PROXY_URL must use https:");
            process.exit(1);
          }
          if (parsed.username || parsed.password) {
            console.error("::error::YARK_CURSEFORGE_PROXY_URL must not include credentials");
            process.exit(1);
          }
          if (parsed.search || parsed.hash) {
            console.error("::error::YARK_CURSEFORGE_PROXY_URL must not include query or hash");
            process.exit(1);
          }
          if (!parsed.hostname) {
            console.error("::error::YARK_CURSEFORGE_PROXY_URL is missing a hostname");
            process.exit(1);
          }
          console.log("Official CurseForge proxy URL is set for this release build.");
          NODE

      - name: Package Windows installer
        # softprops/action-gh-release uploads artifacts; do not let electron-builder
        # auto-publish (it requires GH_TOKEN and races the Release step).
        run: npm run build && npx electron-builder --win --publish never
        env:
          # No Authenticode cert in CI yet — skip auto-discovery so the build
          # does not fail looking for a signing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Baked into main via electron-vite define (#151).
          YARK_CURSEFORGE_PROXY_URL: ${{ vars.YARK_CURSEFORGE_PROXY_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yark-windows-nsis-${{ steps.tag.outputs.version }}
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: YARK server manager ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.yml
          fail_on_unmatched_files: true
