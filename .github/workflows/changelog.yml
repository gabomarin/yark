name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  require-changelog:
    name: Unreleased changelog updated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require ## [Unreleased] change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          set -euo pipefail

          if [ "$SKIP" = "true" ]; then
            echo "Label skip-changelog present — check skipped."
            exit 0
          fi

          # Body of ## [Unreleased] until the next ## [ heading (Keep a Changelog).
          extract_unreleased() {
            awk '
              /^## \[Unreleased\]/ { capture = 1; next }
              /^## \[/ && capture { exit }
              capture { print }
            '
          }

          base_section="$(git show "${BASE_SHA}:CHANGELOG.md" 2>/dev/null | extract_unreleased || true)"
          head_section="$(git show "${HEAD_SHA}:CHANGELOG.md" 2>/dev/null | extract_unreleased || true)"

          if [ -z "$head_section" ]; then
            echo "::error title=Missing Unreleased::CHANGELOG.md must include a ## [Unreleased] section with notes for this PR."
            exit 1
          fi

          if [ "$base_section" = "$head_section" ]; then
            echo "::error title=Unreleased unchanged::PRs must change the ## [Unreleased] section of CHANGELOG.md (not only older version entries). For non-user-facing work only, add the skip-changelog label. See docs/versioning.md and .cursor/rules/changelog.mdc."
            exit 1
          fi

          echo "## [Unreleased] changed between base and head."
