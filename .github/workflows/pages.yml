name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Top-level defaults; job also sets these explicitly (OIDC requires id-token: write).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Avoid cancelling mid-OIDC / deploy when a second Pages push lands.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install and build site
        working-directory: website
        env:
          # Optional: Cloudflare Web Analytics beacon (repo variable; public by design).
          PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_WEB_ANALYTICS_TOKEN }}
        run: |
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          # Default is 10m; give OIDC + Pages status polling more headroom on flaky runs.
          timeout: "900000"
