name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Top-level defaults; job also sets these explicitly (OIDC requires id-token: write).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Avoid cancelling mid-OIDC / deploy when a second Pages push lands.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install and build site
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Default is 10m; give OIDC + Pages status polling more headroom on flaky runs.
          timeout: "900000"
