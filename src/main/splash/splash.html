<!DOCTYPE html>
<html lang="en" data-yark-splash="1">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline';"
    />
    <title>YARK server manager</title>
    <style>
      :root {
        --bg: #0c1427;
        --cyan: #90b5ff;
        --ink: #f4f7fb;
        --muted: #b4c2d8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", "Inter", system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse 70% 55% at 50% 28%, rgba(77, 124, 220, 0.22), transparent 62%),
          radial-gradient(ellipse 50% 40% at 50% 100%, rgba(14, 28, 58, 0.9), transparent 70%),
          var(--bg);
      }

      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(100%, 460px);
        padding: 20px 24px 18px;
      }

      .mark {
        width: min(360px, 86vw);
        line-height: 0;
      }

      .mark svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .yark-glow-soft {
        animation: yark-glow-soft 2.6s ease-in-out infinite;
      }

      .yark-glow-core {
        animation: yark-glow-core 2.6s ease-in-out infinite;
      }

      @keyframes yark-glow-soft {
        0%,
        100% {
          opacity: 0.2;
        }
        50% {
          opacity: 0.85;
        }
      }

      @keyframes yark-glow-core {
        0%,
        100% {
          opacity: 0.28;
        }
        50% {
          opacity: 1;
        }
      }

      .meta {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
        min-height: 1em;
      }

      .status {
        display: flex;
        align-items: baseline;
        margin: 4px 0 0;
        color: var(--cyan);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
      }

      .dot {
        opacity: 0.25;
        animation: dot-blink 1.2s ease-in-out infinite;
      }

      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes dot-blink {
        0%,
        80%,
        100% {
          opacity: 0.2;
        }
        40% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none !important;
          opacity: 1 !important;
        }

        .yark-glow-soft,
        .yark-glow-core {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="YARK server manager is starting">
      <div class="mark">__YARK_SPLASH_SVG__</div>
      <p class="meta" id="version">__YARK_VERSION__</p>
      <p class="status" aria-live="polite">
        Starting<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
      </p>
    </main>
  </body>
</html>
